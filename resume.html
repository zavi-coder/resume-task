<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muazam Kabir - Resume</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="resume.css">

    <!-- Font Awesome for Social Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


   

    <div class="resume">



        <div class="main-content">



            <div class="photo-section">

                <img
                    src="task1.jpg"
                    alt="Muazam Kabir"
                >

            </div>


           

            <div class="information">


               

                <div class="hello">
                    HELLO
                </div>


               

                <h1>
                    I'm <strong>Muazam Kabir</strong>
                </h1>


              

                <h2>
                    Computer Science Student
                </h2>


  

                <div class="line"></div>


               

                <div class="details">


                   

                    <div class="detail-row">

                        <div class="detail-title">
                            AGE
                        </div>

                        <div class="detail-value">
                            24
                        </div>

                    </div>


                   

                    <div class="detail-row">

                        <div class="detail-title">
                            ADDRESS
                        </div>

                        <div class="detail-value">
                            Lahore, Pakistan
                        </div>

                    </div>


                  

                    <div class="detail-row">

                        <div class="detail-title">
                            E-MAIL
                        </div>

                        <div class="detail-value">

                            <a href="mailto:your@email.com">
                                moazzamkabir@email.com
                            </a>

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="detail-row">

                        <div class="detail-title">
                            PHONE
                        </div>

                        <div class="detail-value">
                            +92 300 1234567
                  /      </div>

                    </div>



                    <!-- FREELANCE -->

                    <div class="detail-row">

                        <div class="detail-title">
                            FREELANCE
                        </div>

                        <div class="detail-value">

                            <span class="status">
                                Available
                            </span>

                        </div>

                    </div>


                </div>


            </div>

        </div>


        <!-- =========================
             SOCIAL MEDIA BAR
        ========================== -->

        <div class="social-bar">


            <!-- Facebook -->

            <a
                href="#"
                aria-label="Facebook"
            >

                <i class="fa-brands fa-facebook-f"></i>

            </a>


            <!-- Twitter / X -->

            <a
                href="#"
                aria-label="Twitter"
            >

                <i class="fa-brands fa-twitter"></i>

            </a>


            <!-- LinkedIn -->

            <a
                href="#"
                target="_blank"
                aria-label="LinkedIn"
            >

                <i class="fa-brands fa-linkedin-in"></i>

            </a>


            <!-- Google -->

            <a
                href="#"
                aria-label="Google"
            >

                <i class="fa-brands fa-google-plus-g"></i>

            </a>


            <!-- Dribbble -->

            <a
                href="#"
                aria-label="Dribbble"
            >

                <i class="fa-brands fa-dribbble"></i>

            </a>


            <!-- Instagram -->

            <a
                href="#"
                aria-label="Instagram"
            >

                <i class="fa-brands fa-instagram"></i>

            </a>


        </div>


    </div>


</body>

</html>
